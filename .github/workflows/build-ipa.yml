name: Build SuperHearing IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'SuperHearing.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project SuperHearing.xcodeproj -scheme SuperHearing -resolvePackageDependencies

      - name: Check Code Signing Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ] && [ -n "${{ secrets.MOBILEPROVISION }}" ]; then
            echo "HAS_SECRETS=true" >> $GITHUB_ENV
            echo "::notice::Apple Developer credentials detected. Building signed distribution IPA."
          else
            echo "HAS_SECRETS=false" >> $GITHUB_ENV
            echo "::notice::No Apple Certificate / Provisioning Profile found. Building unsigned/ad-hoc IPA (no Apple account or Team ID needed)."
          fi

      # -----------------------------------------------------------------
      # Optional: Official Apple Developer Signing (if secrets are set)
      # -----------------------------------------------------------------
      - name: Install Apple Certificate and Provisioning Profile
        if: env.HAS_SECRETS == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build_temp_keychain' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & Archive (Signed)
        if: env.HAS_SECRETS == 'true'
        run: |
          mkdir -p build/ipa
          xcodebuild -project SuperHearing.xcodeproj \
            -scheme SuperHearing \
            -configuration Release \
            -archivePath build/SuperHearing.xcarchive \
            -destination "generic/platform=iOS" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/SuperHearing.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist SuperHearing/Resources/ExportOptions.plist

      # -----------------------------------------------------------------
      # Default: Build & Package IPA without Apple certs, profile or Team ID
      # -----------------------------------------------------------------
      - name: Build Archive (Unsigned / No Developer Account)
        if: env.HAS_SECRETS != 'true'
        run: |
          mkdir -p build
          xcodebuild -project SuperHearing.xcodeproj \
            -scheme SuperHearing \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SuperHearing.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA (Ad-Hoc / Sideloading)
        if: env.HAS_SECRETS != 'true'
        run: |
          mkdir -p build/ipa/Payload

          # Locate built application bundle
          if [ -d "build/SuperHearing.xcarchive/Products/Applications/SuperHearing.app" ]; then
            APP_PATH="build/SuperHearing.xcarchive/Products/Applications/SuperHearing.app"
          else
            APP_PATH=$(find build -name "SuperHearing.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Could not find SuperHearing.app in build output!"
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa/Payload/

          # Ad-hoc sign with '-' and embed entitlements so sideloaders (AltStore, Sideloadly, TrollStore) accept it
          if [ -f "SuperHearing/Resources/SuperHearing.entitlements" ]; then
            codesign --force --deep --sign - --entitlements SuperHearing/Resources/SuperHearing.entitlements "build/ipa/Payload/SuperHearing.app" 2>/dev/null || \
            codesign --force --deep --sign - "build/ipa/Payload/SuperHearing.app" || true
          else
            codesign --force --deep --sign - "build/ipa/Payload/SuperHearing.app" || true
          fi

          cd build/ipa
          zip -r -q SuperHearing.ipa Payload
          rm -rf Payload
          echo "Successfully created $(pwd)/SuperHearing.ipa"
          ls -lh SuperHearing.ipa

      # -----------------------------------------------------------------
      # Upload Artifact & Create GitHub Release (Always executed)
      # -----------------------------------------------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperHearing-ipa
          path: build/ipa/*.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa/*.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
